<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A42" />
      <stop offset="100%" stop-color="#8A0012" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Shield / Hexagon outer boundary -->
  <polygon points="24,3 44,11 44,28 24,45 4,28 4,11" stroke="url(#crimsonGlow)" stroke-width="2.5" fill="#0D0E14" />
  <!-- Inner Neural Eye / Grid -->
  <circle cx="24" cy="24" r="9" stroke="#FF2A42" stroke-width="1.8" filter="url(#glow)" />
  <circle cx="24" cy="24" r="4" fill="#FF4D63" />
  <line x1="24" y1="7" x2="24" y2="15" stroke="#FF2A42" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="24" y1="33" x2="24" y2="41" stroke="#FF2A42" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="7" y1="24" x2="15" y2="24" stroke="#FF2A42" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="33" y1="24" x2="41" y2="24" stroke="#FF2A42" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>
